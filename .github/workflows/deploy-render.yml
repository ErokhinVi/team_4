name: Deploy services via Render API

# Селективный редеплой блоков команды через Render REST API. Автодеплоя у самих
# сервисов нет: деплой запускает ТОЛЬКО этот workflow, когда в пуше изменилась
# папка блока.
#
# Настройки репозитория ставит организатор (tools/setup/github-access.sh render):
#   секрет     RENDER_API_KEY
#   переменные RENDER_SID_BACKEND, RENDER_SID_CIB, RENDER_SID_RETAIL
# Пока переменных нет (сервисы на Render еще не созданы), job пишет notice и
# выходит без деплоя.
#
# Каждый блок: ОТДЕЛЬНЫЙ job матрицы со СВОЕЙ concurrency-группой
# (render-deploy-<ref>-<block>). При общей группе и cancel-in-progress:false
# GitHub держит в очереди лишь один pending-ран, и средний из трех близких по
# времени пушей вытесняется самым новым: его сервис молча НЕ выезжает.
# С группой на (ветка, блок) пуши разных блоков идут независимо; повторный пуш
# ОДНОГО блока отменяет лишь свой незавершенный триггер (выезжает последний).

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      services:
        description: "Что передеплоить (через запятую: backend,cib,retail или 'all')"
        required: false
        default: "all"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        block: [backend, cib, retail]
    concurrency:
      group: render-deploy-${{ github.ref }}-${{ matrix.block }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Полная история: в одном пуше бывает несколько коммитов, и для
          # git diff нужен коммит до пуша.
          fetch-depth: 0
      - name: Deploy ${{ matrix.block }} via Render API
        env:
          MANUAL: ${{ inputs.services }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BLOCK: ${{ matrix.block }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SID_BACKEND: ${{ vars.RENDER_SID_BACKEND }}
          SID_CIB: ${{ vars.RENDER_SID_CIB }}
          SID_RETAIL: ${{ vars.RENDER_SID_RETAIL }}
        run: |
          set -e
          case "$BLOCK" in
            backend) SID="$SID_BACKEND";;
            cib)     SID="$SID_CIB";;
            retail)  SID="$SID_RETAIL";;
          esac
          if [ -z "$SID" ]; then
            echo "::notice::нет переменной RENDER_SID_${BLOCK^^}: сервисов на Render еще нет, деплой $BLOCK пропущен"
            exit 0
          fi

          # Нужно ли деплоить ЭТОТ блок?
          if [ "$EVENT" = "workflow_dispatch" ]; then
            REQ="${MANUAL:-all}"
            if [ "$REQ" = "all" ] || echo ",$REQ," | grep -q ",$BLOCK,"; then
              HIT=yes
            else
              HIT=no
            fi
          else
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! CHANGED=$(git diff --name-only "$BEFORE" "$AFTER"); then
              # первый пуш или коммит до пуша недоступен: деплоим все блоки
              CHANGED=$(git ls-files)
            fi
            HIT=no
            # своя папка блока изменилась
            echo "$CHANGED" | grep -qE "^${BLOCK}/" && HIT=yes
            # seed/ грузит только backend
            if [ "$BLOCK" = "backend" ]; then
              echo "$CHANGED" | grep -qE "^seed/" && HIT=yes
            fi
          fi

          if [ "$HIT" != "yes" ]; then
            echo "skip $BLOCK: его папка не менялась в этом пуше"
            exit 0
          fi
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::секрет RENDER_API_KEY пуст"
            exit 1
          fi

          echo " → trigger $BLOCK ($SID)"
          for attempt in 1 2 3 4 5 6; do
            HTTP=$(curl -sS -D /tmp/headers -o /tmp/resp.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/$SID/deploys" \
              -d '{"clearCache":"do_not_clear"}') || HTTP=000
            case "$HTTP" in
              200|201|202)
                echo "   ok: Render принял деплой (HTTP $HTTP)"
                exit 0;;
              429)
                WAIT=$(tr -d '\r' < /tmp/headers | awk 'tolower($1) == "retry-after:" { print int($2) }' | tail -1)
                WAIT=${WAIT:-30}
                if [ "$WAIT" -gt 120 ]; then WAIT=120; fi
                echo "   Render: лимит запросов, жду ${WAIT}s (попытка $attempt)";;
              000|5*)
                WAIT=$((attempt * 10))
                echo "   Render не ответил (HTTP $HTTP), повтор через ${WAIT}s";;
              *)
                echo "::error::Render API вернул $HTTP для $BLOCK"
                cat /tmp/resp.json || true
                exit 1;;
            esac
            sleep "$WAIT"
          done
          echo "::error::Render не принял деплой $BLOCK за 6 попыток"
          exit 1
